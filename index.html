<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mission Sein — Octobre Rose</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <main id="app">
        <h1>Mission Sein — Octobre Rose</h1>
    </main>
    <script>
        /* ===== DONNÉES (modifiables sans toucher à l'interface) ===== */
        const D = {
            q: [
                { q: "Le cancer du sein provoque-t-il toujours une douleur ?", o: ["Oui", "Non", "Je ne sais pas"], a: 1, e: "Non. Un changement peut être indolore : l'absence de douleur ne veut pas dire que tout va bien." },
                { q: "Quel changement peut nécessiter un avis médical ?", o: ["Une nouvelle grosseur", "Une modification de la peau", "Une modification du mamelon", "Tous ces éléments"], a: 3, e: "Tous. Grosseur, peau, mamelon : tout changement inhabituel mérite d'être montré à un professionnel." },
                { q: "Vrai ou faux ? « Une grosseur dans le sein signifie forcément qu'il s'agit d'un cancer. »", o: ["Vrai", "Faux"], a: 1, e: "Faux. Beaucoup de grosseurs sont bénignes. Mais seul un professionnel peut le confirmer : mieux vaut la faire examiner." },
                { q: "« Bien connaître ses seins », cela veut dire…", o: ["Les mesurer chaque jour", "Connaître leur aspect et leur sensation habituels", "Les comparer à ceux des autres"], a: 1, e: "Quand on connaît ses repères, on remarque plus vite ce qui change." },
                { q: "Vrai ou faux ? « Mes seins ne changent jamais au cours de la vie. »", o: ["Vrai", "Faux"], a: 1, e: "Faux. Ils évoluent avec l'âge, le cycle, une grossesse… Un changement nouveau et inhabituel, lui, mérite un avis." },
                { q: "Je remarque un changement inhabituel. Que faire ?", o: ["Attendre en espérant que cela passe", "En parler à un professionnel de santé", "Chercher un diagnostic sur internet"], a: 1, e: "Un professionnel peut examiner, expliquer et orienter. Internet ne peut pas vous examiner." },
                { q: "Vrai ou faux ? « L'auto-observation remplace les examens de dépistage recommandés. »", o: ["Vrai", "Faux"], a: 1, e: "Faux. Elle les complète. Demandez à un professionnel quels examens vous sont recommandés." },
                { q: "Quelle zone faut-il observer ?", o: ["Le sein uniquement", "Le sein, le mamelon, la peau et le creux de l'aisselle"], a: 1, e: "Le tissu mammaire s'étend jusqu'à l'aisselle : on regarde l'ensemble." },
                { q: "Vrai ou faux ? « Si je n'ai aucune douleur, je peux ignorer un changement. »", o: ["Vrai", "Faux"], a: 1, e: "Faux. Un changement visible ou palpable compte, même sans douleur." },
                { q: "Vrai ou faux ? « Ce parcours peut me dire si j'ai un cancer. »", o: ["Vrai", "Faux"], a: 1, e: "Faux. Il informe et guide l'observation. Seul un professionnel de santé peut poser un diagnostic." }
            ],
            cards: [
                ["Nouvelle grosseur", "Une boule ou masse que vous ne connaissiez pas, dans le sein ou près de l'aisselle. Beaucoup sont bénignes, mais seul un professionnel peut le dire."],
                ["Épaississement inhabituel", "Une zone qui semble plus épaisse ou plus dense qu'avant, sans raison évidente."],
                ["Changement de forme", "Un sein dont la forme change nettement par rapport à vos repères habituels."],
                ["Changement de taille", "Un sein qui devient visiblement plus gros ou plus petit qu'avant."],
                ["Modification de la peau", "Rougeur, creux, plissement, aspect de « peau d'orange » : tout ce qui est nouveau mérite un regard."],
                ["Modification du mamelon", "Mamelon qui se rétracte, change de forme ou d'aspect récemment."],
                ["Écoulement inhabituel", "Liquide qui sort du mamelon sans que vous le pressiez, surtout s'il est nouveau."],
                ["Anomalie à l'aisselle", "Une bosse ou un gonflement dans le creux de l'aisselle."]
            ],
            id: ["une nouvelle grosseur", "une modification inhabituelle de la peau", "une modification récente du mamelon", "un écoulement inhabituel", "une anomalie au niveau de l'aisselle"],
            zones: ["Haut du sein", "Haut, côté extérieur", "Côté extérieur", "Bas, côté extérieur", "Bas du sein", "Bas, côté intérieur", "Côté intérieur", "Haut, côté intérieur", "Creux de l'aisselle"],
            dir: [
                { n: "Centre de santé Les Palmiers", t: "Centre de santé", v: "Cotonou", c: "Akpakpa", a: "Rue 123, Akpakpa", p: "+229 00 00 00 01", h: "Lun–Ven 8h–17h" },
                { n: "Hôpital Régional Exemple", t: "Hôpital", v: "Porto-Novo", c: "Ouando", a: "Avenue Centrale", p: "+229 00 00 00 02", h: "Tous les jours 24h/24" },
                { n: "Centre Rose d'Oncologie", t: "Centre spécialisé", v: "Cotonou", c: "Cadjehoun", a: "Boulevard Exemple", p: "+229 00 00 00 03", h: "Lun–Sam 8h–16h" },
                { n: "Cabinet de gynécologie Aurore", t: "Gynécologue", v: "Abomey-Calavi", c: "Godomey", a: "Route Exemple", p: "+229 00 00 00 04", h: "Lun–Ven 9h–18h" },
                { n: "Cabinet d'oncologie Horizon", t: "Oncologue", v: "Cotonou", c: "Haie Vive", a: "Rue 45, Haie Vive", p: "+229 00 00 00 05", h: "Sur rendez-vous" },
                { n: "Association partenaire Mission Rose", t: "Structure partenaire", v: "Parakou", c: "Centre-ville", a: "Place Exemple", p: "+229 00 00 00 06", h: "Mar–Sam 9h–15h" }
            ]
        };
        const ST = ["Je sais", "J'observe", "Je vérifie", "Je reconnais", "J'identifie", "J'agis"];
        const M = { quiz: 0, observe: 1, palpate: 2, cards: 3, identify: 4, directory: 5 };
        const ENC = encodeURIComponent, $ = s => document.querySelector(s), app = $('#app');

        /* ===== MOTEUR : état, progression, reprise locale (aucune donnée envoyée) ===== */
        const KEY = 'mission-sein-v1';
        let S; try { S = JSON.parse(localStorage.getItem(KEY)) } catch (e) { }
        S = S || { screen: 'home', xp: 0, bd: [], qi: 0, os: 0, ps: 0, pz: [], ci: [], ii: 0, ans: { id: [] }, minor: false, started: false };
        let T = { p: null, ch: [], open: null, f: { v: '', t: '', q: '' }, w: false, rem: null, c: '' };
        const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) { } };
        const track = (n, p) => console.debug('[analytics]', n, p || {}); /* jamais de données médicales */
        function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2200) }
        const xp = n => { S.xp += n; toast('+' + n + ' XP') };
        const badge = b => { if (!S.bd.includes(b)) { S.bd.push(b); setTimeout(() => toast('Badge « ' + b + ' » débloqué'), 900) } };
        /* 0 = rien signalé · 1 = doute · 2 = changement signalé */
        const flag = () => { const a = [S.ans.obs, ...S.ans.id]; return a.includes('Oui') ? 2 : a.some(x => x && x.startsWith('Je ne')) ? 1 : 0 };
        function go(s, f) { if (M[s] != null) S.last = s; S.back = S.screen; S.screen = s; save(); render(f); scrollTo(0, 0) }
        function done(m, b, next) { xp(10); if (b) badge(b); track('mission_completed', { m }); go(next) }

        /* ===== COMPOSANTS ===== */
        const hd = () => {
            const n = M[S.screen]; if (n == null || (S.screen == 'directory' && flag())) return '';
            return `<div class="hd"><div class="row"><span class="k" style="display:flex;align-items:center;gap:8px">${ic(MI[n], 22)}Mission ${n + 1}/6 · ${ST[n]}</span><span class="xp">${S.xp} XP</span></div><div class="bar" role="progressbar" aria-label="Progression du parcours" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${n}"><i style="width:${Math.round((n + .5) / 6 * 100)}%"></i></div></div>`
        };
        const ft = () => `<div class="ft"><p>Information et sensibilisation : l'auto-observation ne remplace ni une consultation médicale ni les examens de dépistage recommandés.</p><button data-a="to" data-v="sources">Sources médicales</button><button data-a="to" data-v="faq">FAQ</button><button data-a="reset">Recommencer</button></div>`;
        const opts = (arr, act) => `<div role="group" aria-label="Réponses">${arr.map(o => `<button class="opt" data-a="${act}" data-v="${o}">${o}</button>`).join('')}</div>`;
        const IC = {
            heart: '<path d="M20 33C8 25 6 15 12 11c4-3 8 0 8 4 0-4 4-7 8-4 6 4 4 14-8 22z"/>',
            lump: '<circle cx="20" cy="20" r="15"/><circle cx="24" cy="17" r="4" fill="currentColor"/>',
            eye: '<path d="M3 20q17-17 34 0-17 17-34 0z"/><circle cx="20" cy="20" r="5"/>',
            size: '<circle cx="13" cy="23" r="8"/><circle cx="27" cy="17" r="11"/>',
            chat: '<path d="M6 8h28v18H18l-8 7v-7H6z"/><path d="M14 17h12"/>',
            shield: '<path d="M20 4l13 5v10c0 8-6 13-13 17C13 32 7 27 7 19V9z"/><path d="M14 20l5 5 8-9"/>',
            arm: '<path d="M9 6c4 12 4 20 0 28M31 6c-4 12-4 20 0 28"/><circle cx="20" cy="22" r="4"/>',
            ribbon: '<path d="M20 18C12 6 4 6 6 14c2 6 9 6 14 4zm0 0c8-12 16-12 14-4-2 6-9 6-14 4zM20 18l-7 16 5-3 2 5 2-5 5 3z"/>',
            thick: '<path d="M5 12q8-5 15 0t15 0M5 20q8-5 15 0t15 0M5 28q8-5 15 0t15 0"/>',
            shape: '<path d="M20 6c10 0 15 8 13 16s-8 12-13 12S8 30 7 22 10 6 20 6z"/><path stroke-dasharray="2 4" d="M20 2c13 0 20 10 17 20"/>',
            skin: '<circle cx="20" cy="20" r="15"/><circle cx="14" cy="16" r="1.6" fill="currentColor"/><circle cx="23" cy="14" r="1.6" fill="currentColor"/><circle cx="26" cy="23" r="1.6" fill="currentColor"/><circle cx="16" cy="25" r="1.6" fill="currentColor"/>',
            nip: '<circle cx="20" cy="20" r="15"/><circle cx="20" cy="20" r="6"/>',
            drop: '<path d="M20 5C13 15 9 20 9 26a11 11 0 0022 0c0-6-4-11-11-21z"/>',
            bulb: '<path d="M20 4a10 10 0 00-5 19v4h10v-4a10 10 0 00-5-19zM15 32h10M17 36h6"/>',
            hand: '<path d="M12 22V10m6 12V6m6 16V8m6 14V14M10 22c-3 0-4 3-2 6l6 8h12c4-4 6-8 6-14"/>',
            cards: '<rect x="5" y="9" width="20" height="26" rx="3" transform="rotate(-8 15 22)"/><rect x="15" y="5" width="20" height="26" rx="3" transform="rotate(8 25 18)"/>',
            mag: '<circle cx="17" cy="17" r="11"/><path d="M26 26l10 10"/>',
            pin: '<path d="M20 36C10 24 8 19 8 15a12 12 0 0124 0c0 4-2 9-12 21z"/><circle cx="20" cy="15" r="4"/>'
        };
        const MI = ['bulb', 'eye', 'hand', 'cards', 'mag', 'pin'], CK = ['lump', 'thick', 'shape', 'size', 'skin', 'nip', 'drop', 'arm'], QI = ['heart', 'lump', 'lump', 'eye', 'size', 'chat', 'shield', 'arm', 'heart', 'ribbon'];
        const ic = (k, s = 24) => `<svg class="ic" viewBox="0 0 40 40" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
        const ib = k => `<span class="ib">${ic(k, 32)}</span>`;
        /* Illustrations : buste stylisé (0 bras bas · 1 deux bras levés · 2 un bras levé), miroir, fleurs, ruban */
        const figIn = (up, m) => { const a = up > 0, b = up == 1; return `${m ? '<clipPath id="mc"><ellipse cx="100" cy="95" rx="94" ry="90"/></clipPath><ellipse cx="100" cy="95" rx="94" ry="90" fill="var(--card)"/><g clip-path="url(#mc)">' : '<g>'}<g transform="translate(0 12)"><g stroke="var(--plum)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path fill="var(--soft)" d="M93 56Q62 58 58 84L54 190H146L142 84Q138 58 107 56z"/><path fill="none" d="${a ? 'M58 84L34 36' : 'M58 84Q42 124 38 190'}M${b ? '142 84L166 36' : '142 84Q158 124 162 190'}"/><circle cx="100" cy="28" r="18" fill="var(--soft)"/><path fill="var(--plum)" d="M82 26q2-22 18-22t18 22q-9-11-18-9t-18 9z"/><path fill="none" d="M94 44v12M106 44v12"/><circle cx="82" cy="118" r="17" fill="var(--card)"/><circle cx="118" cy="118" r="17" fill="var(--card)"/></g><circle cx="82" cy="118" r="3" fill="var(--pink)"/><circle cx="118" cy="118" r="3" fill="var(--pink)"/></g></g>${m ? '<ellipse cx="100" cy="95" rx="94" ry="90" fill="none" stroke="var(--plum)" stroke-width="5"/><path d="M34 40q8-14 24-22" stroke="var(--pink)" stroke-width="4" stroke-linecap="round" fill="none"/>' : ''}` };
        const bust = (up, m) => `<svg viewBox="0 0 200 190" role="img" aria-label="Illustration d'un buste féminin${up ? ', bras levé' : ''}${m ? ', dans un miroir' : ''}">${figIn(up, m)}</svg>`;
        const flw = (x, y, s, c) => `<g transform="translate(${x} ${y}) scale(${s})">${[0, 72, 144, 216, 288].map(r => `<ellipse rx="6" ry="12" cy="-11" fill="${c}" transform="rotate(${r})"/>`).join('')}<circle r="5" fill="var(--plum)"/></g>`;
        const star = (x, y, s, d) => `<path class="tw" style="animation-delay:${d}s" fill="var(--pink)" transform="translate(${x} ${y}) scale(${s})" d="M0-8Q1-1 8 0Q1 1 0 8Q-1 1-8 0Q-1-1 0-8z"/>`;
        const lf = (x, y, r) => `<path fill="var(--ok)" opacity=".45" transform="translate(${x} ${y}) rotate(${r})" d="M0 0q14-18 28 0q-14 18-28 0z"/>`;
        const rib = '<path d="M0 0C-12-16-24-22-22-10c2 12 14 12 22 10zm0 0C12-16 24-22 22-10c-2 12-14 12-22 10zM0 0-12 26l8-6 4 8 4-8 8 6z"/>';
        const hero = () => `<svg class="scene" viewBox="0 0 320 230" role="img" aria-label="Une femme se regarde dans un miroir, entourée de fleurs et d'un ruban rose"><circle cx="160" cy="118" r="104" fill="var(--soft)"/><circle cx="268" cy="48" r="24" fill="var(--pink)" opacity=".2"/><circle cx="46" cy="170" r="18" fill="var(--plum)" opacity=".14"/>${lf(36, 104, -30)}${lf(256, 112, 40)}${lf(30, 62, -60)}<svg x="92" y="12" width="136" height="130" viewBox="0 0 200 190">${figIn(0, 1)}</svg>${flw(66, 190, 1.1, 'var(--pink)')}${flw(108, 212, .8, 'var(--plum)')}${flw(240, 198, 1, 'var(--pink)')}${flw(276, 170, .7, 'var(--plum)')}<g transform="translate(160 188) scale(1.5)"><g class="float" fill="var(--pink)">${rib}</g></g>${star(52, 40, 1.4, 0)}${star(284, 104, 1, .8)}${star(196, 14, 1.1, 1.5)}${star(118, 8, .8, 2)}</svg>`;
        const party = () => { const C = ['var(--pink)', 'var(--plum)', 'var(--ok)', 'var(--soft)']; return `<svg class="scene" viewBox="0 0 320 190" role="img" aria-label="Un ruban rose entouré de confettis"><circle cx="160" cy="105" r="78" fill="var(--soft)"/>${lf(40, 112, -30)}${lf(250, 122, 40)}${flw(70, 152, 1.1, 'var(--pink)')}${flw(256, 150, 1.1, 'var(--plum)')}<g transform="translate(160 98) scale(2.3)"><g class="float" fill="var(--pink)">${rib}</g></g>${star(112, 40, 1.6, 0)}${star(214, 50, 1.3, .7)}${Array.from({ length: 18 }, (_, i) => { const y = 60 + (i * 37) % 100; return `<rect class="cf" x="${12 + i * 17}" y="${y}" width="8" height="12" rx="2" fill="${C[i % 4]}" stroke="var(--pink)" stroke-width=".5" style="--d:${y + 10}px;animation:fall 2.2s ${(i % 6) * .15}s ease-out both"/>` }).join('')}</svg>` };
        const FING = '<svg viewBox="0 0 200 150" role="img" aria-label="Trois doigts joints, la pulpe vers le sein"><g fill="var(--soft)" stroke="var(--plum)" stroke-width="3"><rect x="40" y="34" width="32" height="100" rx="16"/><rect x="84" y="20" width="32" height="114" rx="16"/><rect x="128" y="34" width="32" height="100" rx="16"/></g><g fill="var(--pink)"><ellipse cx="56" cy="56" rx="11" ry="14"/><ellipse cx="100" cy="42" rx="11" ry="14"/><ellipse cx="144" cy="56" rx="11" ry="14"/></g></svg>';
        const CIRC = '<svg viewBox="0 0 200 150" role="img" aria-label="Petits mouvements circulaires"><circle cx="100" cy="75" r="52" fill="var(--soft)" stroke="var(--plum)" stroke-width="3"/><g class="spin" fill="none" stroke="var(--pink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M140 75a40 40 0 1 1-40-40"/><path d="M92 25l12 10-12 10"/></g><circle cx="100" cy="75" r="6" fill="var(--plum)"/></svg>';
        const wedge = i => { const a = (i * 45 - 112.5) * Math.PI / 180, b = a + Math.PI / 4, p = (t, r) => (100 + r * Math.cos(t)).toFixed(1) + ' ' + (100 + r * Math.sin(t)).toFixed(1); return `M${p(a, 18)}L${p(a, 82)}A82 82 0 0 1 ${p(b, 82)}L${p(b, 18)}A18 18 0 0 0 ${p(a, 18)}Z` };
        const zoneSvg = cur => `<svg viewBox="0 0 240 200" role="group" aria-label="Schéma du sein en 8 zones et de l'aisselle">${D.zones.map((z, i) => { const c = `z${S.pz.includes(i) ? ' v' : ''}${i == cur ? ' cur' : ''}`, at = `class="${c}" data-a="zone" data-v="${i}" role="button" tabindex="0" aria-label="Zone ${i + 1}, ${z}${S.pz.includes(i) ? ', explorée' : ''}"`; return i < 8 ? `<path ${at} d="${wedge(i)}"/>` : `<ellipse ${at} cx="214" cy="52" rx="22" ry="30"/>` }).join('')}<circle cx="100" cy="100" r="9" fill="var(--plum)"/></svg>`;

        /* ===== ÉCRANS ===== */
        const SC = {
            home() {
                const r = S.started && S.last ? `<button class="cta s" data-a="resume">REPRENDRE OÙ J'EN ÉTAIS</button>` : '';
                return `<div class="hero">${hero()}<h1 tabindex="-1">Et si vous preniez quelques minutes pour mieux connaître vos seins ?</h1><p>Apprenez les bons gestes, observez votre poitrine et découvrez quand demander un avis médical.</p><p class="sig">Apprendre. Observer. Vérifier. Agir.</p></div><button class="cta" data-a="start">COMMENCER MA MISSION</button>${r}<div class="note">Cette expérience est destinée à l'information et à l'auto-observation. Elle ne permet pas de diagnostiquer une maladie. En cas de changement inhabituel, consultez un professionnel de santé.</div>`
            },
            consent() { return `<div class="top">${ib('shield')}</div><h1 tabindex="-1">Avant de commencer</h1><p>Mission Sein, c'est un parcours de 5 missions, en quelques minutes. On le fait ensemble.</p><div class="note"><b>Ce que c'est :</b> de l'information, de la sensibilisation, de l'auto-observation guidée et de l'orientation.<br><b>Ce que ce n'est pas :</b> un outil de diagnostic. Aucun résultat, aucun « risque » ne vous sera donné.</div><p><b>Votre vie privée :</b> pas de nom, pas de compte. Vos réponses restent sur votre appareil et ne sont envoyées nulle part.</p><label style="display:flex;gap:10px;align-items:center;min-height:48px"><input type="checkbox" id="mn" style="width:24px;height:24px" ${S.minor ? 'checked' : ''}> Facultatif : j'ai moins de 18 ans</label><button class="cta" data-a="ok">J'AI COMPRIS, ON Y VA</button>` },
            quiz() {
                const q = D.q[S.qi], p = T.p;
                return `<div class="top">${ib(QI[S.qi])}<p class="k">Question ${S.qi + 1}/${D.q.length}</p></div><h1 tabindex="-1">${q.q}</h1><div role="group" aria-label="Réponses">${q.o.map((o, i) => `<button class="opt${p != null && i == q.a ? ' right' : p == i ? ' pick' : ''}" data-a="pick" data-v="${i}" ${p != null ? 'disabled' : ''}>${o}${p != null && i == q.a ? ' ✓' : ''}</button>`).join('')}</div>${p != null ? `<div class="exp" id="ex" tabindex="-1"><b>${p == q.a ? 'Bien vu !' : "Pas de souci, voici l'essentiel."}</b> ${q.e}</div><button class="cta" data-a="nextq">${S.qi + 1 < D.q.length ? 'SUIVANT' : 'TERMINER LA MISSION'}</button>` : ''}`
            },
            observe() {
                const s = S.os, m = S.minor ? `<div class="note">Si quelque chose vous inquiète, parlez-en à un adulte de confiance ou à un professionnel de santé.</div>` : '';
                if (s == 0) return `<h1 tabindex="-1">Regardez vos seins dans un miroir.</h1><div class="fig">${bust(0, 1)}</div><p>Installez-vous au calme, dans un endroit bien éclairé. Prenez votre temps.</p><button class="cta" data-a="osn">JE SUIS PRÊTE</button>${m}`;
                if (s == 1) return `<h1 tabindex="-1">Bras le long du corps.</h1><div class="fig">${bust(0, 1)}</div><p>Observez l'apparence générale de vos seins. Touchez chaque point une fois regardé :</p><div class="chips">${['Forme', 'Symétrie', 'Peau', 'Mamelon'].map(c => `<button class="chip" aria-pressed="${T.ch.includes(c)}" data-a="chip" data-v="${c}">${T.ch.includes(c) ? '✓ ' : ''}${c}</button>`).join('')}</div><p class="k">Une petite différence entre vos deux seins est courante. Ce qui compte, c'est ce qui change.</p><button class="cta" data-a="osn">CONTINUER</button>`;
                return `<h1 tabindex="-1">Levez les bras au-dessus de votre tête.</h1><div class="fig">${bust(1, 1)}</div><p>Regardez à nouveau : forme, peau, mamelon.</p><h2>Avez-vous remarqué un changement inhabituel ?</h2>${opts(['Non', 'Oui', 'Je ne suis pas sûre'], 'obs')}`
            },
            palpate() {
                const s = S.ps;
                const I = [["Levez un bras.", "Posez la main sur la tête. L'autre main va explorer."], ["Utilisez la pulpe de trois doigts.", "Le plat des doigts, pas le bout."], ["Faites de petits mouvements circulaires.", "Pression douce, puis un peu plus appuyée. Allez-y sans vous presser."]];
                if (s < 3) return `<p class="k">Geste ${s + 1}/3</p><h1 tabindex="-1">${I[s][0]}</h1><p>${I[s][1]}</p><div class="fig">${[bust(2), FING, CIRC][s]}</div><button class="cta" data-a="psn">${s < 2 ? 'SUIVANT' : "C'EST PARTI"}</button>`;
                const cur = D.zones.findIndex((z, i) => !S.pz.includes(i)), n = S.pz.length;
                return `<p class="k">Zone ${Math.min(n + 1, 9)}/9</p><h1 tabindex="-1">${cur < 0 ? 'Toutes les zones sont explorées' : D.zones[cur]}</h1><div class="bar" aria-hidden="true"><i style="width:${n / 9 * 100}%"></i></div><div class="fig">${zoneSvg(cur)}</div>${cur < 0 ? `<p>Bravo. Refaites le même geste de l'autre côté.</p><button class="cta" data-a="pdone">CONTINUER</button>` : `<p>Touchez la zone en mouvement, ou validez-la ici.</p><button class="cta" data-a="zone" data-v="${cur}">J'AI EXPLORÉ CETTE ZONE</button>`}`
            },
            cards() { const o = T.open; return `<h1 tabindex="-1">Quels changements devez-vous connaître ?</h1><p class="k">${S.ci.length}/8 cartes ouvertes</p>${D.cards.map((c, i) => `<button class="card" aria-expanded="${o == i}" data-a="card" data-v="${i}"><span style="display:flex;align-items:center;gap:12px">${ic(CK[i], 28)}${c[0]}</span><span aria-hidden="true">${o == i ? '−' : '+'}</span></button>${o == i ? `<div class="more"><b>Ce que vous devez savoir</b><p>${c[1]} Un avis médical permet d'y voir clair.</p></div>` : ''}`).join('')}<button class="cta" data-a="cdone">CONTINUER</button>` },
            identify() { const i = S.ii; return `<div class="top">${ib(CK[[0, 4, 5, 6, 7][i]])}<p class="k">Question ${i + 1}/5</p></div><h1 tabindex="-1">Avez-vous remarqué ${D.id[i]} ?</h1>${opts(['Non', 'Oui', 'Je ne sais pas'], 'idn')}` },
            nochange() { return `<div class="top">${ib('heart')}</div><h1 tabindex="-1">Vous avez terminé votre observation</h1><div class="note">Vous avez terminé votre parcours d'auto-observation. Continuez à connaître l'apparence et la sensation habituelles de vos seins et soyez attentive à tout nouveau changement.</div><button class="cta" data-a="to" data-v="done">CONTINUER</button>${T.w ? `<div class="exp"><p>C'est tout à fait légitime. Vous pouvez en parler à un professionnel de santé même sans signe particulier : c'est aussi son rôle.</p></div><button class="cta s" data-a="to" data-v="directory">TROUVER UN PROFESSIONNEL DE SANTÉ</button>` : `<button class="cta s" data-a="worry">Je suis quand même inquiète</button>`}` },
            change() { const f = flag(); return `<div class="top">${ib('chat')}</div><h1 tabindex="-1">${f == 2 ? 'Vous avez remarqué un changement' : 'Dans le doute, un avis est possible'}</h1><p>Un changement inhabituel mérite d'être évalué par un professionnel de santé. Cela ne signifie pas nécessairement qu'il s'agit d'un cancer.</p><p>Ne cherchez pas à vous auto-évaluer davantage : un professionnel pourra vous examiner et vous expliquer.</p>${S.minor ? '<p>Vous pouvez en parler à un adulte de confiance, qui pourra vous accompagner.</p>' : ''}<button class="cta" data-a="to" data-v="directory">TROUVER UN PROFESSIONNEL DE SANTÉ</button><button class="cta s" data-a="to" data-v="faq">EN SAVOIR PLUS</button>` },
            directory() { const L = k => [...new Set(D.dir.map(x => x[k]))]; return `<div class="top">${ib('pin')}<h1 tabindex="-1" style="margin:0">Trouver un professionnel</h1></div><p class="k">Données fictives de démonstration.</p><label for="fv">Ville</label><select class="sel" id="fv" data-f="v"><option value="">Toutes les villes</option>${L('v').map(x => `<option ${T.f.v == x ? 'selected' : ''}>${x}</option>`).join('')}</select><label for="ft">Type de structure</label><select class="sel" id="ft" data-f="t"><option value="">Tous les types</option>${L('t').map(x => `<option ${T.f.t == x ? 'selected' : ''}>${x}</option>`).join('')}</select><label for="fq">Nom ou commune</label><input class="sel" id="fq" data-f="q" value="${T.f.q}" type="search"><div id="list">${list()}</div><button class="cta" data-a="to" data-v="done">TERMINER MA MISSION</button>` },
            done() { const u = location.href, tx = "J'ai terminé ma mission santé mammaire. Et vous ? #OctobreRose #MissionSein"; return `${party()}<h1 tabindex="-1">MISSION ACCOMPLIE 🎉</h1><p><b>Vous venez d'apprendre à mieux observer votre santé mammaire.</b></p><h2>Vos acquis</h2><p>✓ J'ai appris<br>✓ J'ai observé<br>✓ J'ai vérifié<br>✓ Je sais quand demander un avis</p>${flag() ? '<div class="note">Pensez à prendre rendez-vous avec un professionnel de santé pour le changement signalé.</div>' : ''}<p>${S.bd.map(b => `<span class="bd">${b}</span>`).join('')}</p><p class="bd big">AMBASSADRICE DE MA SANTÉ</p><div class="share"><span style="color:#fff">${ic('ribbon', 44)}</span><h2>J'ai terminé ma mission santé mammaire.</h2><p>Et vous ?</p><p>Octobre Rose · Mission Sein</p></div><div class="row" style="flex-wrap:wrap"><a class="cta s" style="flex:1" target="_blank" rel="noopener" href="https://wa.me/?text=${ENC(tx + ' ' + u)}">WhatsApp</a><a class="cta s" style="flex:1" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${ENC(u)}">Facebook</a><a class="cta s" style="flex:1" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${ENC(tx)}&url=${ENC(u)}">X</a></div><button class="cta" data-a="copy">PARTAGER MON PARCOURS (Instagram, lien)</button><p id="cp" tabindex="-1" role="status">${T.c}</p><h2>Un rappel pour refaire votre parcours ?</h2><div class="row"><button class="cta s" data-a="rem" data-v="1">Oui</button><button class="cta s" data-a="rem" data-v="0">Non</button></div>${T.rem == 1 ? '<p class="k">Noté. Version démo : aucun rappel n\'est envoyé et rien n\'est collecté.</p>' : ''}<button class="cta" data-a="to" data-v="directory">TROUVER UN CENTRE DE SANTÉ</button><button class="cta s" data-a="reset">RECOMMENCER</button>` },
            sources() { return `<h1 tabindex="-1">Sources médicales</h1><ul><li>Organisation mondiale de la Santé (OMS) : aide-mémoire « Cancer du sein ».</li><li>Institut national du cancer (INCa), France : informations grand public sur le cancer du sein.</li><li>Ligue contre le cancer : brochures de sensibilisation.</li></ul><div class="note">Contenus à faire valider par un comité médical local avant diffusion, et à aligner sur les recommandations nationales de dépistage.</div>${back()}` },
            faq() { const F = [["Ce parcours peut-il dire si j'ai un cancer ?", "Non. Il informe et guide l'observation. Seul un professionnel de santé peut examiner et poser un diagnostic."], ["Une grosseur, est-ce forcément grave ?", "Non, beaucoup sont bénignes. Mais tout changement nouveau mérite un avis."], ["Mes données sont-elles envoyées ?", "Non. Aucun compte, et vos réponses restent sur votre appareil."], ["À quelle fréquence refaire l'observation ?", "Demandez conseil à un professionnel de santé, qui adaptera à votre situation."]]; return `<h1 tabindex="-1">Questions fréquentes</h1>${F.map(f => `<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}${back()}` }
        };
        const back = () => `<button class="cta s" data-a="back">RETOUR</button>`;
        function list() {
            const f = T.f, L = D.dir.filter(x => (!f.v || x.v == f.v) && (!f.t || x.t == f.t) && (!f.q || (x.n + x.c).toLowerCase().includes(f.q.toLowerCase())));
            return L.length ? L.map(x => `<details><summary>${x.n}</summary><p><b>${x.t}</b> · ${x.c}, ${x.v}<br>${x.a}<br>${x.h}<br>${x.p}</p><div class="row"><a class="cta" style="flex:1" href="tel:${x.p.replace(/\s/g, '')}">Appeler</a><a class="cta s" style="flex:1" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${ENC(x.n + ' ' + x.a + ' ' + x.v)}">Itinéraire</a></div></details>`).join('') : '<p>Aucune structure ne correspond. Essayez d\'élargir la recherche.</p>'
        }

        /* ===== ACTIONS ===== */
        const A = {
            start() { S.started = true; track('journey_started'); go('consent') },
            resume() { go(S.last) },
            ok() { S.minor = $('#mn').checked; track('mission_started', { m: 1 }); go('quiz') },
            to(v) { go(v) }, back() { go(S.back || 'home') },
            reset() { S = null; try { localStorage.removeItem(KEY) } catch (e) { } S = { screen: 'home', xp: 0, bd: [], qi: 0, os: 0, ps: 0, pz: [], ci: [], ii: 0, ans: { id: [] }, minor: false, started: false }; T.ch = []; T.open = null; T.w = false; go('home') },
            pick(v) { const q = D.q[S.qi]; T.p = +v; track('question_answered'); if (+v == q.a) xp(10); render('#ex') },
            nextq() { T.p = null; if (S.qi + 1 < D.q.length) { S.qi++; save(); render() } else done(1, 'JE SAIS', 'observe') },
            osn() { S.os++; save(); render() },
            chip(v) { T.ch = T.ch.includes(v) ? T.ch.filter(x => x != v) : [...T.ch, v]; render('[aria-pressed]') },
            obs(v) { S.ans.obs = v; done(2, "J'OBSERVE", S.minor ? 'cards' : 'palpate') },
            psn() { S.ps++; save(); render() },
            zone(v) { v = +v; if (!S.pz.includes(v)) { S.pz.push(v); save(); if (S.pz.length == 9) { xp(20); badge('JE VÉRIFIE'); track('mission_completed', { m: 3 }) } } render() },
            pdone() { go('cards') },
            card(v) { v = +v; T.open = T.open == v ? null : v; if (!S.ci.includes(v)) S.ci.push(v); save(); render('[aria-expanded=true]') },
            cdone() { done(4, null, 'identify') },
            idn(v) { S.ans.id[S.ii] = v; if (S.ii < 4) { S.ii++; save(); render() } else { xp(10); track('mission_completed', { m: 5 }); const f = flag(); if (f) track('health_change_reported'); badge("J'AGIS"); go(f ? 'change' : 'nochange') } },
            worry() { T.w = true; render() },
            copy() { const t = "J'ai terminé ma mission santé mammaire. Et vous ? #OctobreRose #MissionSein " + location.href; track('share_clicked'); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => T.c = 'Copié ! Collez-le dans Instagram ou ailleurs.').catch(() => T.c = 'Copie impossible ici : utilisez les boutons de partage.').then(() => render('#cp')) },
            rem(v) { T.rem = +v; render('#cp') }
        };

        /* ===== RENDU & ÉVÈNEMENTS ===== */
        function render(f) {
            const s = SC[S.screen] ? S.screen : 'home'; if (s == 'done' && !S.fin) { S.fin = 1; save(); track('journey_completed') }
            app.innerHTML = hd() + `<section class="sc${s == 'change' ? ' sober' : ''}">${SC[s]()}</section>${s == 'change' ? '' : ft()}`;
            const e = $(f || 'h1') || app; e.focus && e.focus({ preventScroll: true })
        }
        document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset.v) });
        document.addEventListener('keydown', e => { if ((e.key == 'Enter' || e.key == ' ') && e.target.matches('[role=button][data-a]')) { e.preventDefault(); e.target.dispatchEvent(new Event('click', { bubbles: true })) } });
        document.addEventListener('input', e => { const f = e.target.dataset.f; if (!f) return; T.f[f] = e.target.value; track('health_center_search'); $('#list').innerHTML = list() });
        render();
    </script>
</body>

</html>
